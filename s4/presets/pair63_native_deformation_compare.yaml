description: Minimal native-core deformation ablation replay on the (6,3) pair without rendering.
jax_platform: cpu
assays:
  - deformation_ablation
config_patch:
  eval:
    post_run:
      max_steps: 4000
      native_max_steps: 4000
      trials_per_side: 1
      native_pairs:
        - goal_distance: 6
          cliff_distance: 3
      deformation_conditions:
        - intact
        - deformation_off
      deformation_surfaces:
        - native_core
      deformation_render_conditions: []
      trace:
        enabled: false
