[project]
name = "sensing-edges"
version = "0.1.0"
description = "Deformation sensing ablation on cliff-walk task for NCA-CTRNN controllers"
requires-python = ">=3.11"
dependencies = [
    "jax==0.9.0.1",
    "jaxlib==0.9.0.1",
    "numpy>=1.24.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "evosax>=0.2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "jsonschema>=4.23",
    "jax-evogym",
]

[project.optional-dependencies]
remote = ["modal>=0.73"]
wandb = ["wandb>=0.19"]
dev = ["pytest>=8.0"]
all = ["sensing-edges[remote,wandb,dev]"]

[project.scripts]
sensing-edges-train = "sensing_edges.experiment:main"
sensing-edges-eval = "sensing_edges.evaluate:main"

[tool.uv.sources]
jax-evogym = { git = "https://github.com/btgaskin/jax-evogym", tag = "v0.1.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["sensing_edges"]

[tool.pytest.ini_options]
testpaths = ["tests"]
